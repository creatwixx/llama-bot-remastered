# =============================================================================
# Llama Bot — ZimaOS deployment
# =============================================================================
# Paste this whole file into: ZimaOS App Store -> "Install a Custom App".
#
# BEFORE YOU PASTE, replace these three placeholders:
#   1. REPLACE_DB_PASSWORD  -> a long random string (appears TWICE, must match)
#   2. REPLACE_DISCORD_TOKEN -> your bot token from discord.com/developers
#   3. REPLACE_GUILD_ID     -> your server ID, or leave "" for global commands
#
# Do NOT use ${VARIABLE} syntax here. ZimaOS pastes this YAML without an
# accompanying .env file, so any ${...} would silently resolve to an empty string.
# Literal values only.
#
# There is no `build:` section and no source bind mounts on purpose: ZimaOS has no
# checkout of this repo, so images are pulled prebuilt from GHCR (published by
# .github/workflows/publish.yml).
# =============================================================================

name: llama-bot

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — replaces the Railway-hosted database
  # ---------------------------------------------------------------------------
  llama-postgres:
    # Postgres 18 to match the version that produced railway_backup.dump
    # (pg_dump 18.1). Restoring an 18 dump into 16 is not guaranteed to work.
    image: postgres:18-alpine
    container_name: llama-postgres
    restart: unless-stopped
    networks: [llama-net]
    environment:
      POSTGRES_USER: llama
      POSTGRES_PASSWORD: REPLACE_DB_PASSWORD
      POSTGRES_DB: llamabot
    volumes:
      # Mount /var/lib/postgresql, NOT /var/lib/postgresql/data. The postgres:18
      # image sets PGDATA=/var/lib/postgresql/18/docker and declares its volume at
      # /var/lib/postgresql. Mounting the old PG16 path leaves the real data
      # directory inside the container layer, where it is destroyed on recreate.
      - type: bind
        source: /DATA/AppData/llama-bot/postgres
        target: /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llama -d llamabot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # API — owns all database access; migrates itself on boot
  # ---------------------------------------------------------------------------
  llama-api:
    image: ghcr.io/creatwixx/llama-api:latest
    container_name: llama-api
    restart: unless-stopped
    networks: [llama-net]
    depends_on:
      llama-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://llama:REPLACE_DB_PASSWORD@llama-postgres:5432/llamabot
      NODE_ENV: production
      LOG_LEVEL: info
      API_PORT: "3000"
      # Where the dashboard's "Discord bot" health tile looks.
      BOT_HEALTH_URL: http://llama-bot:8080/health
    # This service also serves the management dashboard at /, so its port must be
    # published. Bind it to the box's TAILSCALE address — NOT 0.0.0.0.
    #
    # There is no login on the dashboard, and the API underneath it has no
    # authentication either: anything that can reach this port can delete every
    # emote. Binding to the tailnet address means only your Tailscale devices can
    # open it; binding to 0.0.0.0 would expose it to every device on your LAN.
    #
    # Find the address on the box with:  tailscale ip -4
    ports:
      - "REPLACE_TAILSCALE_IP:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3000/health'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Bot — outbound-only WebSocket to the Discord gateway
  # ---------------------------------------------------------------------------
  llama-bot:
    image: ghcr.io/creatwixx/llama-bot:latest
    container_name: llama-bot
    restart: unless-stopped
    networks: [llama-net]
    depends_on:
      llama-api:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: REPLACE_DISCORD_TOKEN
      DISCORD_APP_ID: "1448249790994448384"
      # Empty = register commands globally (up to 1h to appear).
      # Set your server ID for instant updates.
      DISCORD_GUILD_ID: "REPLACE_GUILD_ID"
      API_URL: http://llama-api:3000
      NODE_ENV: production
      LOG_LEVEL: info
      BOT_PORT: "8080"
    # Published so you can check bot health over Tailscale. Safe to expose: this
    # endpoint only returns {"status":"ok"}. Remove if you don't want it.
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:8080/health'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Declared explicitly, with an explicit `name:`, because ZimaOS does not reliably
# create the implicit "<project>_default" network. Without a shared user-defined
# network the containers land on Docker's default bridge, which provides NO
# container-name DNS — the API then dies with
# "P1001: Can't reach database server at llama-postgres:5432".
networks:
  llama-net:
    name: llama-net
    driver: bridge
